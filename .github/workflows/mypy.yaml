name: Mypy

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  mypy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant mypy aiohttp voluptuous

      - name: Run mypy
        run: mypy custom_components/nature_remo --ignore-missing-imports
