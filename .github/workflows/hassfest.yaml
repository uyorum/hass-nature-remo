name: Validate with hassfest

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # 毎週日曜日の深夜0時(UTC)に実行
    - cron: "0 0 * * 0"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
